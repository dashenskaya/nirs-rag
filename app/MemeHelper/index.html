<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Helper — подбор мемов</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ===== Сайдбар: история чатов ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <span class="logo"><span class="logo__sticker">Meme Helper</span></span>
        <button class="icon-btn sidebar__close" type="button" id="sidebar-close" aria-label="Закрыть меню">✕</button>
      </div>
      <button class="new-chat" type="button" id="new-chat"><span class="new-chat__plus">+</span>Новый чат</button>
      <!-- Содержимое рисует js/sidebar.js: список чатов или предложение войти -->
      <div class="sidebar__body" id="sidebar-body"></div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <!-- ===== Основная область: чат ===== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" id="sidebar-open" aria-label="Открыть меню">☰</button>
        <h1 class="topbar__title" id="chat-title">Новый чат</h1>
        <!-- Профиль в правом верхнем углу (рисует js/auth.js) -->
        <div id="profile"></div>
      </header>

      <section class="chat" id="chat">
        <!-- Сообщения рисует js/chat.js -->
        <div class="chat__inner" id="messages"></div>
      </section>

      <form class="composer" id="composer">
        <div class="composer__box">
          <textarea id="input" rows="1" maxlength="1000"
                    placeholder="Опишите ситуацию, вставьте цитату или опишите мем…"></textarea>
          <button class="btn composer__send" type="submit" id="send">Отправить</button>
        </div>
        <p class="composer__hint">Enter — отправить · Shift+Enter — новая строка</p>
      </form>
    </main>
  </div>

  <!-- ===== Окно входа / регистрации ===== -->
  <div class="modal" id="auth-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <button class="icon-btn modal__close" type="button" data-close aria-label="Закрыть">✕</button>
      <h2 class="modal__title" id="auth-title">Добро пожаловать!</h2>

      <div class="tabs">
        <button class="tabs__btn tabs__btn--active" type="button" data-tab="login">Вход</button>
        <button class="tabs__btn" type="button" data-tab="register">Регистрация</button>
      </div>

      <form class="form" id="login-form" novalidate>
        <label class="field">
          Логин
          <input type="text" name="login" autocomplete="username" placeholder="nikita">
        </label>
        <label class="field">
          Пароль
          <input type="password" name="password" autocomplete="current-password">
        </label>
        <p class="form-error" hidden></p>
        <button class="btn btn--block" type="submit">Войти</button>
        <p class="form-footer">Нет аккаунта? <button class="link" type="button" data-tab="register">Зарегистрироваться</button></p>
      </form>

      <form class="form" id="register-form" novalidate hidden>
        <label class="field">
          Логин
          <input type="text" name="login" autocomplete="username" placeholder="nikita">
          <span class="hint">Латиница, цифры, точка, _ или -, от 3 до 20 символов</span>
        </label>
        <label class="field">
          Никнейм
          <input type="text" name="nickname" maxlength="30" placeholder="Как вас называть">
        </label>
        <label class="field">
          Пароль
          <input type="password" name="password" autocomplete="new-password">
          <span class="hint">Минимум 6 символов</span>
        </label>
        <label class="field">
          Повторите пароль
          <input type="password" name="password2" autocomplete="new-password">
        </label>
        <p class="form-error" hidden></p>
        <button class="btn btn--block" type="submit">Создать аккаунт</button>
        <p class="form-footer">Уже есть аккаунт? <button class="link" type="button" data-tab="login">Войти</button></p>
      </form>
    </div>
  </div>

  <!-- ===== Окно настроек профиля ===== -->
  <div class="modal" id="profile-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <button class="icon-btn modal__close" type="button" data-close aria-label="Закрыть">✕</button>
      <h2 class="modal__title" id="profile-title">Профиль</h2>

      <form class="form" id="profile-form" novalidate>
        <div class="avatar-edit">
          <div id="profile-avatar"></div>
          <div class="avatar-edit__actions">
            <label class="btn btn--outline btn--small">
              Загрузить фото
              <input type="file" accept="image/*" id="avatar-input" hidden>
            </label>
            <button class="link" type="button" id="avatar-remove">Убрать фото</button>
          </div>
        </div>
        <p class="profile-login">Логин: <b id="profile-login"></b></p>
        <label class="field">
          Никнейм
          <input type="text" name="nickname" maxlength="30">
        </label>
        <p class="form-error" hidden></p>
        <button class="btn btn--block" type="submit">Сохранить</button>
      </form>

      <hr class="divider">
      <!-- Видна только администратору -->
      <a class="btn btn--outline btn--block admin-link" href="admin.html" id="admin-link" hidden>Аналитика (админ-панель)</a>
      <button class="btn btn--danger btn--block" type="button" id="logout">Выйти из аккаунта</button>
    </div>
  </div>

  <!-- Порядок важен: данные → API → общие функции → части интерфейса → запуск -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
